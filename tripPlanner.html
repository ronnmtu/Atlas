<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="tripPlanner.css">
  <title>Atlas - Trip Planner</title>
</head>

<body>
  <header class="header">
    <div class="logo">
      <span class="logo-text">Atlas</span>
    </div>
    <nav>
      <a href="index.html" class="back-button">Back to Home</a>
      <a href="destination.html" class="active">Destination</a>
      <a href="trip-planner.html">Trip Planner</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <section class="planner">

      <h1>Plan Your Trip</h1>
      <p>
        Plan and organise your next adventure with Atlas.
      </p>

      <form id="tripForm">

        <input type="text" id="destination" placeholder="Destination" required>

        <input type="date" id="startDate" required>

        <input type="date" id="endDate" required>

        <input type="number" id="budget" placeholder="Budget ($)" required>

        <select id="travelers">

          <option value="">Travellers</option>

          <option>1</option>

          <option>2</option>

          <option>3</option>

          <option>4+</option>

        </select>

        <textarea id="notes" placeholder="Trip notes..."></textarea>

        <button type="submit">

          Save Trip

        </button>

      </form>

    </section>

    <section class="saved-trips">

      <h2>Your Trips</h2>

      <div id="tripContainer"></div>

    </section>

  </main>
</body>

</html>
